name: Semantic Commits

on:
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: commitcheck-csf_tz-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Check Commit Messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 200

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check commit messages
        run: |
          # Run commitlint outside the application directory so unrelated package
          # dependencies and lockfiles cannot break commit-message checks.
          mkdir -p "$RUNNER_TEMP/csf-commitlint"
          cd "$RUNNER_TEMP/csf-commitlint"
          npm install --no-save --no-package-lock @commitlint/cli@19 @commitlint/config-conventional@19
          "$RUNNER_TEMP/csf-commitlint/node_modules/.bin/commitlint" --cwd "$GITHUB_WORKSPACE" --verbose --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}"
