<style>
  #toast {
    visibility: hidden;
    max-width: 50%;
    margin: auto;
    background-color: #333;
    color: #fff;
    text-align: center;
    border-radius: 2px;
    padding: 16px;
    position: absolute;
    z-index: 1;
    left: 50%;
    transform: translate(-50%, 0);
    font-size: 17px;
  }
  #toast.show {
    visibility: visible;
    animation: fadein 0.5s, fadeout 0.5s 2.5s;
  }
  @keyframes fadein {
    from { top: 0; opacity: 0; }
    to { top: 30px; opacity: 1; }
  }
  @keyframes fadeout {
    from { top: 30px; opacity: 1; }
    to { top: 0; opacity: 0; }
  }
</style>
<div id="qr-reader" style="width: 500px"></div>
<div id="qr-reader-results"></div>
<div id="toast"></div>
